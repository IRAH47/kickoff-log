{% extends "base.html" %}
{% block title %}Sign up — Kickoff Log{% endblock %}
{% block content %}
<div class="wrap">
  <div class="auth-card">
    <h1 style="font-size:1.4rem;">Create your account</h1>
    <form method="post">
      <div class="field">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" value="{{ username or '' }}" required autofocus>
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" value="{{ email or '' }}" required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required>
      </div>
      <button class="btn" type="submit" style="width:100%;">Sign up</button>
    </form>
    <p style="margin-top:16px; color:var(--ink-dim); font-size:0.9rem;">
      Already have an account? <a class="underline-link" href="{{ url_for('login') }}">Log in</a>
    </p>
  </div>
</div>
{% endblock %}
