{% extends "base.html" %}
{% block title %}Log in — Kickoff Log{% endblock %}
{% block content %}
<div class="wrap">
  <div class="auth-card">
    <h1 style="font-size:1.4rem;">Log in</h1>
    <form method="post">
      <div class="field">
        <label for="identifier">Username or email</label>
        <input type="text" id="identifier" name="identifier" required autofocus>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required>
      </div>
      <button class="btn" type="submit" style="width:100%;">Log in</button>
    </form>
    <p style="margin-top:16px; color:var(--ink-dim); font-size:0.9rem;">
      New here? <a class="underline-link" href="{{ url_for('register') }}">Create an account</a>
    </p>
  </div>
</div>
{% endblock %}
